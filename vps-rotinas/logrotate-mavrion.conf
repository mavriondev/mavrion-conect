# Rotação dos logs do pm2 (Hub, Norion) e do Connect na VPS.
# Instalado em /etc/logrotate-mavrion.conf e executado de hora em hora pelo cron
# do root com estado próprio (/var/lib/logrotate/status-mavrion), para que o
# limite de tamanho valha dentro do dia e não só na rodada diária do sistema:
#   7 * * * * /usr/sbin/logrotate -s /var/lib/logrotate/status-mavrion /etc/logrotate-mavrion.conf
#
# copytruncate: o pm2 mantém os arquivos abertos em modo append; truncar no lugar
# evita reiniciar processos (e evita o problema do pm2 continuar escrevendo em
# arquivo renomeado).
/root/.pm2/logs/*.log /var/log/mavrion/*.log /var/log/norion-site.log {
    daily
    maxsize 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    nodateext
    su root root
}
