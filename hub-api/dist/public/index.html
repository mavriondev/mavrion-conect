    <div id="root"></div>
    <script>
      function _report(type, detail) {
        try { fetch('/api/client-error', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({type:type, detail:detail.substring(0,5000)}) }); } catch(e) {}
        var d = document.getElementById('root');

      }
      window.onerror = function(msg, url, line, col, err) { _report('JS Error', msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '')); };
      window.addEventListener('unhandledrejection', function(e) { _report('Promise Rejection', (e.reason && e.reason.stack ? e.reason.stack : String(e.reason))); });
    </script>
